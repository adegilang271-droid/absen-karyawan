<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Online</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 360px; text-align: center; box-sizing: border-box; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; margin: 8px 0; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-primary { background-color: #007BFF; }
        .btn-success { background-color: #28a745; }
        .btn-danger { background-color: #dc3545; }
        #kotakKamera { width: 100%; height: 200px; background: #222; border-radius: 8px; margin: 15px 0; overflow: hidden; display: none; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #pesan { margin-top: 15px; font-weight: bold; font-size: 14px; padding: 8px; border-radius: 4px; }
        .sembunyi { display: none !important; }
        .info-gps { font-size: 12px; color: #666; margin: 10px 0; background: #eee; padding: 6px; border-radius: 4px; }
        .grup-masuk { border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 10px; background: #fafafa; }
    </style>
</head>
<body>

<div class="container">
    <h2>SISTEM ABSENSI</h2>
    
    <div id="halamanSignIn">
        <p>Masukkan Kode ID Karyawan Anda</p>
        <input type="text" id="inputKodeId" placeholder="Contoh: K001">
        <button class="btn-primary" onclick="aksiSignIn()">Sign In</button>
    </div>

    <div id="halamanUtama" class="sembunyi">
        <p>Selamat Datang, <span id="labelUser" style="font-weight: bold; color: #007BFF;"></span>!</p>
        
        <div id="kotakKamera"><video id="videoKamera" autoplay playsinline muted></video></div>
        <div class="info-gps">📍 GPS: <span id="labelGps">Mengunci lokasi...</span></div>
        
        <!-- FORM KHUSUS MASUK -->
        <div class="grup-masuk">
            <input type="text" id="inputTempatKerja" placeholder="Ketik Tempat Kerja Kamu (Misal: Proyek A)">
            <button class="btn-success" onclick="aksiAbsen('ABSEN_MASUK')">ABSEN MASUK</button>
        </div>
        
        <!-- TOMBOL KELUAR LANGSUNG TANPA INPUT -->
        <button class="btn-danger" onclick="aksiAbsen('ABSEN_KELUAR')">ABSEN KELUAR / PULANG</button>
    </div>

    <div id="pesan"></div>
</div>

<script>
// 🎯 WAJIB GANTI DENGAN URL /EXEC WEB APP GOOGLE APPS SCRIPT KELUARAN TERBARU
const URL_API_SHEETS = "https://script.google.com/macros/s/AKfycbzSQZKisQ1fZAo1Fsr7WBxIvM5LgLdcOTrdH11NJ0X55BCj8gNjRcn2YfkYuPlpTcA-/exec";

let variabelKodeId = "";
let variabelKoordinatGps = "";

function aksiSignIn() {
    const idInput = document.getElementById("inputKodeId").value.trim();
    if(!idInput) { tampilkanPesan("Kode ID tidak boleh kosong!", "red"); return; }
    
    tampilkanPesan("Memverifikasi Kode ID...", "orange");
    
    const dataKirim = new URLSearchParams();
    dataKirim.append("aksi", "SIGNIN");
    dataKirim.append("kode_id", idInput);
    
    fetch(URL_API_SHEETS, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: dataKirim.toString(), mode: "cors" })
    .then(res => res.json())
    .then(data => {
        if(data.status === "success") {
            variabelKodeId = idInput.toUpperCase();
            tampilkanPesan("Login Berhasil!", "green");
            document.getElementById("halamanSignIn").classList.add("sembunyi");
            document.getElementById("halamanUtama").classList.remove("sembunyi");
            document.getElementById("labelUser").innerText = variabelKodeId;
            aktifkanKameraLive();
            kunciKoordinatGps();
        } else { tampilkanPesan(data.message, "red"); }
    })
    .catch(err => { tampilkanPesan("Koneksi gagal! Periksa deployment skrip Anda.", "red"); });
}

function aksiAbsen(jenisAbsen) {
    if(!variabelKoordinatGps || variabelKoordinatGps === "Gagal mendapatkan lokasi") {
        tampilkanPesan("Gagal absen. GPS belum terkunci!", "red"); return;
    }
    
    const tempatKerjaInput = document.getElementById("inputTempatKerja").value.trim();
    if(jenisAbsen === "ABSEN_MASUK" && !tempatKerjaInput) {
        tampilkanPesan("Tempat kerja wajib diisi sebelum klik masuk!", "red"); return;
    }
    
    tampilkanPesan("Mengirim data absensi...", "orange");
    
    const dataKirim = new URLSearchParams();
    dataKirim.append("aksi", jenisAbsen);
    dataKirim.append("kode_id", variabelKodeId);
    dataKirim.append("gps", variabelKoordinatGps);
    if(jenisAbsen === "ABSEN_MASUK") { dataKirim.append("tempat_kerja", tempatKerjaInput); }
    
    fetch(URL_API_SHEETS, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: dataKirim.toString(), mode: "cors" })
    .then(res => res.json())
    .then(data => {
        if(data.status === "success") {
            tampilkanPesan(data.message, "green");
            if(jenisAbsen === "ABSEN_MASUK") { document.getElementById("inputTempatKerja").value = ""; }
        } else { tampilkanPesan(data.message, "red"); }
    })
    .catch(err => { tampilkanPesan("Gagal mengirim data ke database.", "red"); });
}

function aktifkanKameraLive() {
    const video = document.getElementById("videoKamera");
    document.getElementById("kotakKamera").style.display = "block";
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
    .then(stream => { video.srcObject = stream; })
    .catch(err => { tampilkanPesan("Kamera aktif sebagai live-view saja.", "orange"); });
}

function kunciKoordinatGps() {
    const labelGps = document.getElementById("labelGps");
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                variabelKoordinatGps = position.coords.latitude + ", " + position.coords.longitude;
                labelGps.innerText = variabelKoordinatGps;
                labelGps.style.color = "green";
            },
            (error) => {
                variabelKoordinatGps = "Gagal mendapatkan lokasi";
                labelGps.innerText = "Izinkan lokasi di HP!";
                labelGps.style.color = "red";
            },
            { enableHighAccuracy: true }
        );
    }
}

function tampilkanPesan(teks, warna) {
    const pesan = document.getElementById("pesan");
    pesan.innerText = teks;
    if(warna === "green") { pesan.style.background = "#d4edda"; pesan.style.color = "#155724"; }
    else if(warna === "red") { pesan.style.background = "#f8d7da"; pesan.style.color = "#721c24"; }
    else if(warna === "orange") { pesan.style.background = "#fff3cd"; pesan.style.color = "#856404"; }
}
</script>

</body>
</html>
